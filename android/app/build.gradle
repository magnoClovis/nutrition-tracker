apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def releaseSigningError = null

if (!keystorePropertiesFile.exists()) {
    releaseSigningError = "Missing android/keystore.properties. Copy keystore.properties.example, fill it locally, and never commit it."
} else {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    def requiredSigningProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
    def missingSigningProperties = requiredSigningProperties.findAll {
        !keystoreProperties.getProperty(it)?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        releaseSigningError = "android/keystore.properties is missing required values: ${missingSigningProperties.join(', ')}"
    }
}

android {
    namespace = "com.hermegas.trofia"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hermegas.trofia"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "0.11.0-beta"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningError == null) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningError == null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseArtifactRequested = taskGraph.allTasks.any { task ->
        def taskName = task.name.toLowerCase(Locale.ROOT)
        task.project == project &&
            taskName.contains("release") &&
            ["assemble", "bundle", "package", "sign"].any { taskName.startsWith(it) }
    }
    if (releaseArtifactRequested && releaseSigningError != null) {
        throw new GradleException("Trofia release signing is not configured. ${releaseSigningError}")
    }
    if (releaseArtifactRequested) {
        def requiredReleaseEnvironment = [
            "VITE_FIREBASE_WEB_APP_ID",
            "VITE_RECAPTCHA_ENTERPRISE_SITE_KEY"
        ]
        def missingReleaseEnvironment = requiredReleaseEnvironment.findAll {
            !System.getenv(it)?.trim()
        }
        if (!missingReleaseEnvironment.isEmpty()) {
            throw new GradleException(
                "Trofia release Firebase configuration is missing: ${missingReleaseEnvironment.join(', ')}"
            )
        }

        def releaseWebBundles = fileTree("src/main/assets/public/assets") {
            include "*.js"
        }.files
        def staleReleaseEnvironment = requiredReleaseEnvironment.findAll { variableName ->
            def expectedValue = System.getenv(variableName)?.trim()
            !releaseWebBundles.any { bundle -> bundle.getText("UTF-8").contains(expectedValue) }
        }
        if (!staleReleaseEnvironment.isEmpty()) {
            throw new GradleException(
                "Trofia release web assets do not contain the configured Firebase values: " +
                "${staleReleaseEnvironment.join(', ')}. Rebuild Vite and sync Capacitor first."
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
