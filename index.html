<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#093C2D"/>
  <script>
    // Apply the migrated or saved theme before styles or body content can be painted.
    (function(){
      try {
        var darkDefaultMigrationKey='appThemeDefaultDarkV1';
        if(localStorage.getItem(darkDefaultMigrationKey)!=='1'){
          localStorage.setItem('appDarkMode','true');
          localStorage.setItem(darkDefaultMigrationKey,'1');
        }
        var savedDarkMode=localStorage.getItem('appDarkMode');
        var initialTheme=savedDarkMode==='false'?'light':'dark';
        document.documentElement.dataset.theme=initialTheme;
        document.documentElement.classList.toggle('dark-loading',initialTheme==='dark');
      } catch (error) {
        document.documentElement.dataset.theme='dark';
        document.documentElement.classList.add('dark-loading');
      }
    })();
  </script>
  <title>Trofia</title>
  <link vite-ignore rel="manifest" href="manifest.json"/>
  <link vite-ignore rel="icon" type="image/png" sizes="32x32" href="trofia-favicon-32.png"/>
  <link vite-ignore rel="apple-touch-icon" sizes="180x180" href="trofia-apple-touch-icon.png"/>
  <link rel="stylesheet" href="one-ui.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#f2f1ed;color:#252220;font-family:system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    #root{min-height:100vh}
    :root {
      --bg:#f2f1ed; --surface:#ffffff; --surface3:#f7f5f1; --input:#f5f3ef;
      --track:#dedad2; --row:#fbfaf7; --border:#d8d3ca; --border2:#b8b4ac;
      --border3:#e4dfd6; --text:#252220; --text2:#4f4b47; --text3:#6a6662;
      --muted:#7a746e; --muted2:#8a8580; --dim:#9a948c; --faint:#b5aea5;
      --btn-ok:#e8f4e8; --btn-ok-border:#9ad29a; --btn-ok-text:#2a6a2a;
      --btn-info:#eef0f8; --btn-info-border:#aab2d8;
      --btn-info-text:#5264a2; --btn-warn:#f9eeee; --btn-warn-border:#d8aaaa;
      --btn-warn-text:#a25252; --btn-teal:#e7f5f5; --btn-teal-border:#9ed0d0;
      --btn-teal-text:#2b8080; --btn-inactive:#f7f5f1;
      --btn-inactive-border:#d8d3ca; --btn-inactive-text:#8a8580;
      --tab-active:#ffffff; --tab-text-active:#c8a96e;
    }
    body { background: var(--bg); color: var(--text); }
    button,input,select,textarea {
      transition: background-color 220ms ease, border-color 220ms ease, color 220ms ease, box-shadow 220ms ease, transform 180ms ease, opacity 220ms ease;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    @keyframes softIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes softScaleIn {
      from { opacity: 0; transform: scale(.985); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    #loading{
      --initial-loading-page:var(--surface-page,#f2f1ed);
      --initial-loading-ink:var(--text-primary,#20231f);
      --initial-loading-copy:var(--text-secondary,#777b72);
      --initial-loading-brand:var(--accent-action-fill,#5f9828);
      --initial-loading-brand-deep:#2f681b;
      --initial-loading-aura:rgba(95,152,40,.18);
      position:fixed;inset:0;background:var(--initial-loading-page);display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:24px;color:var(--initial-loading-copy);font-size:13px;
      letter-spacing:2px;text-transform:uppercase;z-index:10000;opacity:1;transition:opacity .26s ease;
    }
    #loading.is-hidden{opacity:0;pointer-events:none}
    html[data-theme="dark"] #loading{
      --initial-loading-page:var(--surface-page,#0e100e);
      --initial-loading-ink:var(--text-primary,#f0f2ec);
      --initial-loading-copy:var(--text-secondary,#a8aca2);
      --initial-loading-brand:var(--accent-action-fill,#8bc54c);
      --initial-loading-brand-deep:#b6e17e;
      --initial-loading-aura:rgba(139,197,76,.2);
    }
    .initial-loading-brand{position:relative;display:grid;place-items:center;gap:16px;text-transform:none}
    .initial-loading-aura{position:absolute;top:-19px;width:118px;height:118px;border-radius:50%;background:var(--initial-loading-aura);transform:scale(.64);opacity:0;animation:initialLoadingAuraIn .95s cubic-bezier(.2,.8,.2,1) both,initialLoadingAuraBreathe 1.8s .95s ease-in-out infinite}
    .initial-loading-mark{width:82px;height:82px;position:relative;display:grid;place-items:center;border-radius:27px;color:var(--initial-loading-page);background:linear-gradient(145deg,var(--initial-loading-brand),var(--initial-loading-brand-deep));box-shadow:0 14px 30px rgba(42,92,28,.2);transform:scale(.78);animation:initialLoadingMarkIn .9s cubic-bezier(.2,.8,.2,1) both,initialLoadingBreathe 1.8s .9s ease-in-out infinite}
    .initial-loading-letter{font-size:44px;line-height:1;font-weight:500;letter-spacing:-4px;transform:translateX(-2px)}
    .initial-loading-leaf{position:absolute;top:14px;right:14px;width:17px;height:10px;border-radius:100% 0 100% 0;background:currentColor;transform:rotate(-18deg)}
    .initial-loading-wordmark{color:var(--initial-loading-ink);font-size:25px;line-height:1;font-weight:500;letter-spacing:-.7px;opacity:0;transform:translateY(7px);animation:initialLoadingWordIn .52s .44s ease-out both}
    #initial-loading-text{min-height:20px;line-height:1.4;letter-spacing:.12em}
    .initial-loading-progress{width:76px;height:3px;overflow:hidden;border-radius:99px;background:color-mix(in srgb,var(--initial-loading-copy) 20%,transparent)}
    .initial-loading-progress span{display:block;width:34%;height:100%;border-radius:inherit;background:var(--initial-loading-brand);transform:translateX(-110%);animation:initialLoadingProgress 1.25s .7s ease-in-out infinite}
    @keyframes initialLoadingMarkIn{from{transform:scale(.78);opacity:.55}to{transform:scale(1);opacity:1}}
    @keyframes initialLoadingAuraIn{from{transform:scale(.64);opacity:0}to{transform:scale(1);opacity:.62}}
    @keyframes initialLoadingWordIn{to{opacity:1;transform:translateY(0)}}
    @keyframes initialLoadingBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes initialLoadingAuraBreathe{0%,100%{transform:scale(1);opacity:.48}50%{transform:scale(1.12);opacity:.72}}
    @keyframes initialLoadingProgress{0%{transform:translateX(-110%)}55%,100%{transform:translateX(300%)}}
    @media (prefers-reduced-motion:reduce){
      #loading{transition-duration:.12s}
      .initial-loading-mark{transform:scale(1);opacity:1;animation:none!important}
      .initial-loading-aura{transform:scale(1);opacity:.55;animation:none!important}
      .initial-loading-wordmark{opacity:1;transform:none;animation:none!important}
      .initial-loading-progress span{width:100%;transform:none;animation:none!important}
    }
    select option{background:#f5f3ef;color:#252220}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg,#f2f1ed)}::-webkit-scrollbar-thumb{background:var(--border2,#b8b4ac);border-radius:2px}
    input[type=date]{color-scheme:dark}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
    .app-loading-spinner{animation:spin 1.2s linear infinite}

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    [data-tutorial-active] {
      outline: 2px solid #7ec87e !important;
      outline-offset: 3px;
      border-radius: 6px;
      animation: tutorialPulse 1.2s ease-in-out infinite;
      position: relative;
      z-index: 100002;
    }
    @keyframes tutorialPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(126,200,126,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(126,200,126,0); }
    }
    .nutrition-summary-cards > span {
      min-height: 76px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text2);
      line-height: 1.35;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex-direction: column;
    }
    .nutrition-summary-cards > span:nth-child(1),
    .nutrition-summary-cards > span:nth-child(5) {
      color: #c8a96e;
    }
    .nutrition-summary-cards > span:nth-child(2) {
      color: #8ec8c8;
    }
    .nutrition-summary-cards > span:nth-child(3) {
      color: #c86e8e;
    }
    .nutrition-summary-cards > span:nth-child(4) {
      border-color: var(--btn-ok-border);
      background: var(--btn-ok);
      color: var(--btn-ok-text) !important;
      font-weight: 600;
    }
    [data-diary-meal-card="true"] {
      display: block !important;
      width: 100% !important;
    }
    [data-diary-meal-header="true"],
    [data-diary-meal-items="true"] {
      width: 100% !important;
      box-sizing: border-box;
    }
    [data-diary-meal-items="true"] {
      display: block !important;
      clear: both;
    }
#app-version-footer {
  width: 100%;
  padding: 34px 16px 40px;
  background: #ebe8e2;
  color: #746f68;
  border-top: 1px solid #d8d3ca;
  text-align: center;
  font-size: 13px;
  letter-spacing: .6px;
}
@media (max-width: 720px) {
  #app-version-footer {
    padding-bottom: calc(112px + var(--app-safe-bottom));
  }
}
</style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite" aria-atomic="true">
    <div class="initial-loading-brand" aria-hidden="true">
      <div class="initial-loading-aura"></div>
      <div class="initial-loading-mark"><span class="initial-loading-letter">T</span><span class="initial-loading-leaf"></span></div>
      <div class="initial-loading-wordmark">Trofia</div>
    </div>
    <div id="initial-loading-text">Carregando…</div>
    <div class="initial-loading-progress" aria-hidden="true"><span></span></div>
  </div>
  <div id="root"></div>
  <footer id="app-version-footer" aria-label="Versão do aplicativo"></footer>
  <script>
  window.APP_VERSION_LABEL = 'Trofia v0.11.0 Beta';
  window.INITIAL_LOADING_MIN_MS = 900;
  window.initialLoadingStartedAt = typeof performance !== 'undefined' ? performance.now() : Date.now();
  window.initialLoadingHideTimer = null;
  window.initialLoadingRemoveTimer = null;
  window.initialLoadingHideRequested = false;

  document.getElementById('app-version-footer').textContent = window.APP_VERSION_LABEL;

  window.setInitialLoadingText = function(text){
    var label = document.getElementById('initial-loading-text');
    if (label && text) label.textContent = text;
  };

  try {
    var initialLoadingLanguage = String(localStorage.getItem('appLang') || 'pt').toLowerCase();
    window.setInitialLoadingText(initialLoadingLanguage.indexOf('en') === 0
      ? 'Loading…'
      : initialLoadingLanguage.indexOf('es') === 0 ? 'Cargando…' : 'Carregando…');
  } catch (_) {
    window.setInitialLoadingText('Carregando…');
  }

  window.hideInitialLoading = function(){
    var loading = document.getElementById('loading');
    if (!loading) return;
    if (window.initialLoadingHideRequested) return;
    window.initialLoadingHideRequested = true;
    var now = typeof performance !== 'undefined' ? performance.now() : Date.now();
    var elapsed = Math.max(0, now - window.initialLoadingStartedAt);
    var remaining = Math.max(0, window.INITIAL_LOADING_MIN_MS - elapsed);
    window.initialLoadingHideTimer = setTimeout(function(){
      loading.classList.add('is-hidden');
      window.initialLoadingRemoveTimer = setTimeout(function(){
        if (loading && loading.parentNode) loading.parentNode.removeChild(loading);
      }, 280);
    }, remaining);
  };

  // Shows startup failures in the loading layer. This is intentionally small:
  // once React renders, normal in-app error handling takes over. The DOM is
  // built with textContent instead of innerHTML so unexpected error text cannot
  // inject markup into the page.
  function showStartupError(title, message, detail) {
    var el = document.getElementById('loading');
    if (!el || el.style.display === 'none') return;
    if (window.initialLoadingHideTimer) {
      clearTimeout(window.initialLoadingHideTimer);
      window.initialLoadingHideTimer = null;
    }
    if (window.initialLoadingRemoveTimer) {
      clearTimeout(window.initialLoadingRemoveTimer);
      window.initialLoadingRemoveTimer = null;
    }
    window.initialLoadingHideRequested = false;
    el.classList.remove('is-hidden');

    var box = document.createElement('div');
    box.style.color = '#c87e7e';
    box.style.padding = '24px';
    box.style.textAlign = 'center';
    box.style.maxWidth = '400px';
    box.style.lineHeight = '1.6';

    if (title) {
      var heading = document.createElement('div');
      heading.style.fontSize = '18px';
      heading.style.marginBottom = '12px';
      heading.textContent = title;
      box.appendChild(heading);
    }

    var body = document.createElement('div');
    body.style.fontSize = title ? '12px' : '14px';
    body.style.wordBreak = 'break-word';
    body.style.opacity = title ? '0.8' : '1';
    body.textContent = String(message || '').slice(0, title ? 300 : 200);
    box.appendChild(body);

    if (detail) {
      var meta = document.createElement('div');
      meta.style.fontSize = '10px';
      meta.style.marginTop = '8px';
      meta.style.opacity = '0.4';
      meta.textContent = detail;
      box.appendChild(meta);
    }

    el.replaceChildren(box);
  }

  window.addEventListener('unhandledrejection', function(e){
    var msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    showStartupError('', msg, '');
  });

  window.onerror = function(msg, src, line, col){
    showStartupError('Erro', msg, line + ':' + col);
    return false;
  };
  </script>
  <!-- The parallel Vite entry mounts the ESM composition root. -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
