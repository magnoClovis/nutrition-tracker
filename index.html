<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#111111"/>
  <title>Diário Nutricional</title>
  <link rel="icon" type="image/png" href="icone.png"/>
  <link rel="apple-touch-icon" href="icone.png"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#f2f1ed;color:#252220;font-family:system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    #root{min-height:100vh}
    :root {
      --bg:#111; --surface:#161616; --surface3:#141414; --input:#1e1e1e;
      --track:#1c1c1c; --row:#181818; --border:#222; --border2:#2a2a2a;
      --border3:#1e1e1e; --text:#e8e0d5; --text2:#d5cfc8; --text3:#c9bfb0;
      --muted:#8a8a8a; --muted2:#7a7a7a; --dim:#444; --faint:#333;
      --btn-ok:#1e2e1e; --btn-ok-border:#3a5a3a; --btn-ok-text:#7ec87e;
      --btn-info:#1a1e2a; --btn-info-border:#2a2a4a;
      --btn-info-text:#8a9ec8; --btn-warn:#2a1a1a; --btn-warn-border:#4a2a2a;
      --btn-warn-text:#c87e7e; --btn-teal:#1a2a2a; --btn-teal-border:#2a4a4a;
      --btn-teal-text:#7ec8c8; --btn-inactive:#191919;
      --btn-inactive-border:#252525; --btn-inactive-text:#666;
      --tab-active:#191919; --tab-text-active:#c9bfb0;
    }
    body { background: var(--bg); color: var(--text); }
    #loading{position:fixed;inset:0;background:#f2f1ed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#888;font-size:13px;letter-spacing:2px;text-transform:uppercase;z-index:10000}
    .dark-loading #loading{background:#f2f1ed;color:#888;}
    .dark-loading #loading div:first-child{border-color:#d8d4cc!important;border-top-color:#2a6a2a!important;}
    select option{background:#f5f3ef;color:#252220}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg,#f2f1ed)}::-webkit-scrollbar-thumb{background:var(--border2,#b8b4ac);border-radius:2px}
    input[type=date]{color-scheme:dark}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
  
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    [data-tutorial-active] {
      outline: 2px solid #7ec87e !important;
      outline-offset: 3px;
      border-radius: 6px;
      animation: tutorialPulse 1.2s ease-in-out infinite;
      position: relative;
      z-index: 100002;
    }
    @keyframes tutorialPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(126,200,126,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(126,200,126,0); }
    }
    .nutrition-summary-cards > span {
      min-height: 76px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text2);
      line-height: 1.35;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex-direction: column;
    }
    .nutrition-summary-cards > span:nth-child(1),
    .nutrition-summary-cards > span:nth-child(5) {
      color: #c8a96e;
    }
    .nutrition-summary-cards > span:nth-child(2) {
      color: #8ec8c8;
    }
    .nutrition-summary-cards > span:nth-child(3) {
      color: #c86e8e;
    }
    .nutrition-summary-cards > span:nth-child(4) {
      border-color: var(--btn-ok-border);
      background: var(--btn-ok);
      color: var(--btn-ok-text) !important;
      font-weight: 600;
    }
</style>
</head>
<body>
  <div id="loading">
    <div style="width:30px;height:30px;border-radius:50%;border:3px solid #d8d4cc;border-top-color:#2a6a2a;animation:spin 1.2s linear infinite"></div>
    <div style="animation:pulse 1.5s ease-in-out infinite">Carregando...</div>
  </div>
  <div id="root"></div>
  <script>
  // Applies the saved theme before React renders, so the loading screen does
  // not flash in the wrong mode while Firebase and the app scripts initialize.
  (function(){
    if(localStorage.getItem('appDarkMode')==='true'){
      document.documentElement.classList.add('dark-loading');
    }
  })();

  // Shows startup failures in the loading layer. This is intentionally small:
  // once React renders, normal in-app error handling takes over.
  window.addEventListener('unhandledrejection', function(e){
    var el = document.getElementById('loading');
    var msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);

    if (el && el.style.display !== 'none') {
      el.innerHTML =
        '<div style="color:#c87e7e;padding:24px;text-align:center">' +
        '⚠ ' + msg.slice(0, 200) +
        '</div>';
    }
  });

  window.onerror = function(msg, src, line, col){
    var el=document.getElementById('loading');

    if (el) {
      el.innerHTML =
        '<div style="color:#c87e7e;padding:24px;text-align:center;max-width:400px;line-height:1.6">' +
          '<div style="font-size:18px;margin-bottom:12px">⚠ Erro</div>' +
          '<div style="font-size:12px;word-break:break-word;opacity:0.8">' +
            String(msg).slice(0, 300) +
          '</div>' +
          '<div style="font-size:10px;margin-top:8px;opacity:0.4">' +
            line + ':' + col +
          '</div>' +
        '</div>';
    }

    return false;
  };
  </script>
  <!-- Third-party bundles live in vendor/ so index.html stays readable; do not edit minified vendor files manually. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/prop-types.min.js"></script>
  <script src="vendor/recharts.min.js"></script>

  <!-- App scripts are split by responsibility: persistence adapter first, UI/application second. -->
  <script src="firebase-storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
