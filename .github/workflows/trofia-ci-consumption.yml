name: Trofia - consumo de CI

on:
  schedule:
    - cron: '0 9 * * 0'
      timezone: Europe/Madrid
    - cron: '0 22 28-31 * *'
      timezone: Europe/Madrid
  workflow_dispatch:
    inputs:
      report:
        description: Relatório a executar
        required: true
        default: weekly
        type: choice
        options: [weekly, monthly]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Select report mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_REPORT: ${{ inputs.report }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "value=ci-$MANUAL_REPORT" >> "$GITHUB_OUTPUT"
          elif [[ "$SCHEDULE_EXPRESSION" == "0 9 * * 0" ]]; then
            echo "value=ci-weekly" >> "$GITHUB_OUTPUT"
          else
            echo "value=ci-monthly" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and send CI report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.TROFIA_GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.TROFIA_GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.TROFIA_GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: clovis.automatik@gmail.com
          REPORT_RECIPIENT: cmagno.dev@gmail.com
        run: node scripts/trofia-cloud-automation.mjs "${{ steps.mode.outputs.value }}"
