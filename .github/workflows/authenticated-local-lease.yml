name: Authenticated local lease
run-name: Authenticated local lease ${{ inputs.lease_id }}

on:
  workflow_dispatch:
    inputs:
      lease_id:
        description: Opaque UUID generated by the local authenticated test coordinator
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # This is deliberately identical to CI. Once this workflow is running, a
  # newly-triggered authenticated CI remains queued until the local holder
  # cancels the lease during teardown.
  group: nutrition-authenticated-suite
  cancel-in-progress: false

jobs:
  hold:
    name: Hold authenticated test account
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate opaque lease identifier
        shell: bash
        env:
          LEASE_ID: ${{ inputs.lease_id }}
        run: |
          if [[ ! "$LEASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Invalid lease identifier." >&2
            exit 1
          fi

      - name: Hold shared authenticated-suite concurrency group
        shell: bash
        run: sleep 3600
