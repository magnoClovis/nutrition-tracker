name: Documentation preflight

on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - '*.md'
      - '*.txt'
  pull_request:
    branches: [main]
    paths:
      - 'documentation/**'
      - '*.md'
      - '*.txt'

permissions:
  contents: read

jobs:
  preflight:
    name: Quick repository sanity
    runs-on: windows-2022
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Run quick preflight
        shell: pwsh
        run: pwsh -NoProfile -File scripts/preflight-release.ps1
