name: C08 production validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/src/structured-estimates.js'
      - 'worker/src/pantry-suggestions.js'
      - 'meal-review-ai.js'
      - 'nutrition-feedback-ai.js'
      - 'scripts/validate-c08-production.mjs'
      - '.github/workflows/c08-production-validation.yml'

permissions:
  contents: read

concurrency:
  group: c08-production-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Gemini contracts in production
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Check the latest commit for validation changes
        id: runtime
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- \
            worker/src/structured-estimates.js \
            worker/src/pantry-suggestions.js \
            meal-review-ai.js \
            nutrition-feedback-ai.js \
            scripts/validate-c08-production.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.runtime.outputs.changed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Run controlled production validation
        if: steps.runtime.outputs.changed == 'true'
        run: node scripts/validate-c08-production.mjs
