name: Pantry production smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/src/ai-worker.js'
      - 'worker/src/pantry-suggestions.js'
      - 'pantry-suggestions-ai.js'
      - 'ai-client.js'
      - 'scripts/smoke-pantry-production.mjs'
      - '.github/workflows/pantry-production-smoke.yml'

permissions:
  contents: read

concurrency:
  group: pantry-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify deployed pantry endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Check the latest commit for runtime changes
        id: runtime
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- \
            worker/src/ai-worker.js \
            worker/src/pantry-suggestions.js \
            pantry-suggestions-ai.js \
            ai-client.js \
            scripts/smoke-pantry-production.mjs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Call production with a disposable account
        if: steps.runtime.outputs.changed == 'true'
        run: node scripts/smoke-pantry-production.mjs
