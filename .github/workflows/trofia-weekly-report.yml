name: Trofia - relatório semanal

on:
  schedule:
    - cron: '0 10 * * 0'
      timezone: Europe/Madrid
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - name: Build and send weekly report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.TROFIA_OPENAI_API_KEY }}
          OPENAI_AUTOMATION_MODEL: ${{ vars.TROFIA_OPENAI_MODEL }}
          GMAIL_CLIENT_ID: ${{ secrets.TROFIA_GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.TROFIA_GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.TROFIA_GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: clovis.automatik@gmail.com
          REPORT_RECIPIENT: cmagno.dev@gmail.com
        run: node scripts/trofia-cloud-automation.mjs weekly-report
